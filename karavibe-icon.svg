<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Microphone body -->
  <rect x="85" y="75" width="30" height="50" rx="15" fill="url(#micGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Microphone mesh top -->
  <circle cx="100" cy="75" r="16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="100" cy="75" r="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Microphone stand -->
  <line x1="100" y1="125" x2="100" y2="145" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="148" r="4" fill="#ffffff"/>
  
  <!-- Musical notes -->
  <g>
    <!-- First note -->
    <circle cx="55" cy="50" r="4" fill="#fbbf24"/>
    <line x1="59" y1="50" x2="65" y2="35" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Second note -->
    <circle cx="145" cy="45" r="4" fill="#fbbf24"/>
    <line x1="149" y1="45" x2="155" y2="25" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="155" y1="25" x2="162" y2="30" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Third note -->
    <circle cx="50" cy="150" r="4" fill="#fbbf24"/>
    <line x1="54" y1="150" x2="60" y2="135" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Sound waves -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
</svg>